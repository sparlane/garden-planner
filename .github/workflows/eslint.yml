name: ESLint

on:
  pull_request

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v7
     - name: Setup Node
       uses: actions/setup-node@v7
       with:
         node-version: 24
         cache: npm
     - name: Install modules
       run: npm ci
     - name: Run ESLint
       run: npm run check
     - name: Run TypeScript type checking
       run: npm run typecheck
